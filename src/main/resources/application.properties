spring.application.name=payment-gateway-service

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_gateway}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Initialization
spring.sql.init.mode=always

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

payment.events.topic=${PAYMENT_EVENTS_TOPIC:payment-events}

# Outbox Poller
outbox.poller.batch-size=${OUTBOX_POLLER_BATCH_SIZE:100}
outbox.poller.fixed-delay-ms=${OUTBOX_POLLER_FIXED_DELAY_MS:1000}

# Stripe webhook endpoint signing secret (whsec_...), supplied at runtime.
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
